name: Plugin Validation

on:
  push:
    branches: [main, master]
    paths:
      - '.claude-plugin/**'
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'hooks/**'
      - 'scripts/**'
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          if [ ! -f .claude-plugin/plugin.json ]; then
            # Try alternative location
            if [ -f plugin.json ]; then
              echo "OK: plugin.json at root"
              jq empty plugin.json || { echo "FAIL: Invalid JSON"; exit 1; }
              jq '{name, version}' plugin.json
            else
              echo "FAIL: No plugin.json found"
              exit 1
            fi
          else
            echo "OK: .claude-plugin/plugin.json"
            jq empty .claude-plugin/plugin.json || { echo "FAIL: Invalid JSON"; exit 1; }
            jq '{name, version}' .claude-plugin/plugin.json
          fi

      - name: Validate skills
        run: |
          if [ -d skills ]; then
            for d in skills/*/; do
              [ -f "$d/SKILL.md" ] && echo "OK: $(basename $d)" || echo "WARN: $(basename $d) missing SKILL.md"
            done
          fi

      - name: Validate commands
        run: |
          if [ -d commands ]; then
            for f in commands/*.md; do
              [ -f "$f" ] && echo "OK: $(basename $f)"
            done
          fi

      - name: Check scripts executable
        run: |
          if [ -d scripts ]; then
            for f in scripts/*.sh; do
              [ -f "$f" ] && [ ! -x "$f" ] && echo "WARN: $f not executable"
            done
          fi
